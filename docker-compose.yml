version: '3.8'

services:
  pulse:
    build: .
    container_name: runagent-pulse
    ports:
      - "8000:8000"
    volumes:
      - ./pulse-data:/app/data
    environment:
      - PULSE_API_KEY=${PULSE_API_KEY:-}
      - PULSE_TIMEZONE=UTC
      - PULSE_DEBUG=${PULSE_DEBUG:-true}
      - PULSE_DB_PATH=/app/data/pulse.db
    restart: unless-stopped


