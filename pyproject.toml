[project]
name = "runagent-pulse"
version = "0.1.0"
description = "Lightweight scheduling service for AI agents"
authors = [
    {name = "RunAgent Team", email = "team@runagent.ai"},
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "aiosqlite>=0.19.0",
    "python-dateutil>=2.8.0",
    "croniter>=1.4.0",
    "pytz>=2023.3",
    "requests>=2.31.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "sdk"}
packages = ["runagent_pulse"]
